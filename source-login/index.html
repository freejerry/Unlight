<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15202c" />
    <title>Unlight Login</title>
    <link rel="stylesheet" href="/source-login/style.css" />
    <script type="module" src="/source-login/stage.js"></script>
    <script type="module" src="/source-login/login.js"></script>
    <script type="module" src="/source-login/news.js"></script>
  </head>
  <body>
    <main id="stage" aria-labelledby="login-title">
      <canvas id="stage-background" width="780" height="680" aria-hidden="true"></canvas>
      <p id="stage-background-status" role="status" hidden></p>
      <form id="login" class="stage-panel LoginPanel" method="post" aria-labelledby="login-title">
        <h1 id="login-title" class="stage-panel-title" lang="en">Login</h1>
        <div class="login-body">
          <fieldset id="login-fields" disabled>
            <legend class="sr-only">帳號資料</legend>
            <label for="username" class="LoginLabel" lang="en">
              <span>Name:</span>
              <input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16" pattern="[A-Za-z0-9_.\-]{1,16}" required />
            </label>
            <label for="password" class="LoginLabel" lang="en">
              <span>Pass:</span>
              <input id="password" type="password" autocomplete="current-password" maxlength="16" pattern="[A-Za-z0-9_.\-]{1,16}" required />
            </label>
            <button id="login-submit" type="submit" lang="en">Login</button>
          </fieldset>
          <p id="login-status" role="status" aria-atomic="true" tabindex="-1" data-state="idle"></p>
          <noscript><p>請啟用 JavaScript 以登入。</p></noscript>
        </div>
      </form>
      <section id="news" class="stage-panel" data-state="loading">
        <h2 id="news-title" class="stage-panel-title" lang="en">News</h2>
        <div class="news-body">
          <p id="news-status" role="status" aria-atomic="true">正在讀取最新消息…</p>
          <div id="news-content" role="region" aria-labelledby="news-title" tabindex="0" hidden></div>
        </div>
      </section>
    </main>
    <footer class="attribution">
      Unlight 原作 CPA ·
      <a href="https://github.com/ni-light/Unlight-Images/tree/0ec2d2ffb0e294e46cd0edfb84c9778e3dd4ed0e">原始素材</a>
      <a href="https://creativecommons.org/licenses/by-nd/4.0/" rel="license">CC BY-ND 4.0</a>
    </footer>
  </body>
</html>
