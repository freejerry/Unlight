[package]
name = "native-deadlines"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
