<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112235" />
    <meta name="description" content="用瀏覽器驗證 Unlight 原版六項服務的 KeepAlive 回覆、測試登入與原始素材。" />
    <title>Unlight 連線診斷</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/client.js"></script>
    <script type="module" src="/login.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-content">
        <span class="wordmark">Unlight</span>
        <span class="topbar-label">連線診斷</span>
        <a class="topbar-link" href="#session-title">登入驗證</a>
      </div>
    </header>

    <main id="diagnostics" class="shell" data-state="idle" aria-labelledby="page-title">
      <div class="page-heading">
        <div>
          <h1 id="page-title">原版協定檢查</h1>
          <p>以原版 KeepAlive 封包逐一驗證六個服務的二進位回覆。</p>
        </div>
        <div class="actions">
          <button id="run-checks" type="button" class="button primary">開始檢查</button>
          <button id="retry-failed" type="button" class="button secondary" hidden>重試失敗項目</button>
        </div>
      </div>

      <section class="summary" aria-labelledby="overall-status">
        <div class="summary-heading">
          <h2 id="overall-status" aria-live="polite" aria-atomic="true">尚未檢查</h2>
          <span id="progress-label">完成 0 / 6</span>
        </div>
        <progress id="progress" max="6" value="0" aria-label="已完成檢查的服務數"></progress>
        <p id="overall-detail">檢查會送出 5 bytes 並核對 7 bytes 回覆。</p>
      </section>

      <section class="services" aria-labelledby="services-title">
        <h2 class="sr-only" id="services-title">服務檢查結果</h2>
        <div id="service-list" class="service-list"></div>
      </section>

      <section id="asset-checks" class="assets" data-state="loading" aria-labelledby="assets-title">
        <h2 id="assets-title">原始素材</h2>
        <div class="asset-list">
          <div class="asset">
            <div id="image-preview" class="image-preview" hidden>
              <img id="asset-image" alt="Unlight 原版道具圖示" />
            </div>
            <div>
              <h3>道具圖示</h3>
              <p id="image-status" data-state="loading" role="status">讀取設定中…</p>
            </div>
          </div>
          <div class="asset asset-sound">
            <div>
              <h3>背景音樂</h3>
              <p id="audio-status" data-state="loading" role="status">讀取設定中…</p>
            </div>
            <audio id="asset-audio" preload="metadata" hidden></audio>
            <button id="play-audio" type="button" class="button secondary" disabled hidden>播放</button>
          </div>
        </div>
      </section>

      <section class="session-panel" aria-labelledby="session-title">
        <div class="session-heading">
          <div>
            <h2 id="session-title" tabindex="-1">本機登入驗證</h2>
            <p id="session-description">用測試帳號登入，驗證大廳、資料與全域聊天連線。</p>
          </div>
          <p id="session-status" class="session-status" data-state="idle" role="status" aria-atomic="true">尚未登入</p>
        </div>

        <form id="session-form" method="post" autocomplete="off" aria-describedby="session-description session-detail">
          <fieldset id="session-fields" class="session-fields" disabled>
            <legend class="sr-only">測試帳號</legend>
            <label for="session-username">帳號
              <input id="session-username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16" pattern="[A-Za-z0-9_.\-]{1,16}" aria-describedby="session-format" required />
            </label>
            <label for="session-password">密碼
              <input id="session-password" type="password" autocomplete="off" maxlength="16" pattern="[A-Za-z0-9_.\-]{1,16}" aria-describedby="session-format" required />
            </label>
            <button type="submit" class="button primary">驗證登入</button>
          </fieldset>
          <p id="session-format" class="session-format">帳號與密碼可用 1 至 16 個英文字母、數字、底線、句點或連字號。</p>
        </form>

        <div id="session-result" class="session-result" hidden>
          <dl class="session-metadata">
            <div><dt>玩家 ID</dt><dd id="session-player-id">—</dd></div>
            <div><dt>大廳連線</dt><dd id="session-lobby">—</dd></div>
            <div><dt>資料連線</dt><dd id="session-data">—</dd></div>
            <div><dt>全域聊天</dt><dd id="session-chat">—</dd></div>
          </dl>
          <button id="session-signout" type="button" class="button secondary" hidden>登出</button>
        </div>
        <p id="session-detail" class="session-detail" aria-live="polite"></p>
      </section>

      <template id="service-template">
        <article class="service" data-state="idle">
          <header class="service-heading">
            <h3 class="service-name"></h3>
            <span class="service-status">待檢查</span>
          </header>
          <p class="service-port"></p>
          <p class="service-detail">等待開始檢查。</p>
          <div class="response"><span>回覆</span><code class="response-hex" data-testid="response-hex">—</code></div>
        </article>
      </template>
      <noscript><p>請啟用 JavaScript 以執行連線診斷。</p></noscript>
    </main>
  </body>
</html>
